[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galbot-mcap2lerobot"
version = "0.1.0"
description = "Convert Galbot MCAP recordings to LeRobot v2.1 dataset format."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Jia Junjie", email = "jiajunjie@galbot.com" },]
dependencies = [
  "numpy>=1.21.0",
  "opencv-python>=4.5.0",
  "scipy>=1.7.0",
  "mcap>=0.0.1",
  "protobuf>=3.20.0",
  "lerobot==0.3.3",
  "ffmpeg-python>=0.2.0",
  "tqdm>=4.62.0",
  "pandas>=1.3.0",
  "pyarrow>=10.0.0",
  "termcolor>=2.0.0",
]

[project.scripts]
galbot-mcap2lerobot = "galbot_mcap2lerobot.galbot_mcap_to_lerobot:cli_main"
merge-lerobot-v2-1 = "galbot_mcap2lerobot.merge_lerobot_v2_1:main"
inspect-mcap = "galbot_mcap2lerobot.inspect_mcap:cli_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = [
  ".git",
  "__pycache__",
  "*.pyc",
  ".ruff_cache",
  ".venv",
  "venv",
]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8-naming
  "UP", # pyupgrade
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "DTZ",# flake8-datetimez
  "SIM",# flake8-simplify
  "TID",# flake8-tidy-imports
  "RUF",# ruff-specific rules
  "D",  # pydocstyle (docstrings)
]
ignore = [
  "D100", # Missing docstring in public module
  "D103", # Missing docstring in public function
  "D104", # Missing docstring in public package
  "D203", # 1 blank line required before class docstring (conflicts with D211)
  "D212", # Multi-line docstring summary should start at the first line
  "D213", # Multi-line docstring summary should start at the second line
  "D417", # Missing argument descriptions in docstring (Google style)
  "E501", # Line too long (allow 100+ chars for readability)
  "N803", # Argument name should be lowercase (allow W/H for width/height)
  "N806", # Variable in function should be lowercase (allow uppercase const)
  "SIM102", # Use single if statement instead of nested (allow for readability)
  "SIM109", # Use `in` instead of multiple comparisons (allow for clarity)
  "B007", # Unused loop variable (allow descriptive names)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["galbot_mcap2lerobot"]
force-single-line = false
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
